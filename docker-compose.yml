services:
  db:
    image: postgres:17
    container_name: goyfield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/ivaqis/goyfield-backend:latest
    build:
      context: ./goyfield-backend
    container_name: goyfield-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is required}
      SIGN_SECRET: ${SIGN_SECRET:?SIGN_SECRET is required}
      SIGN_ISSUER: ${SIGN_ISSUER:-goyfield}
      LOGGING_LEVEL: ${LOGGING_LEVEL:-info}
      GRYPHLINE_AUTH_URL: ${GRYPHLINE_AUTH_URL:-}
      SKPORT_BASE_DOMAIN: ${SKPORT_BASE_DOMAIN:-}
      SKPORT_CRED_PATH: ${SKPORT_CRED_PATH:-}
      SKPORT_BIND_PATH: ${SKPORT_BIND_PATH:-}
      SKPORT_DETAIL_PATH: ${SKPORT_DETAIL_PATH:-}
      SKPORT_CC_PATH: ${SKPORT_CC_PATH:-}
      SKPORT_CC_REC_PATH: ${SKPORT_CC_REC_PATH:-}
      SKPORT_MONUMENT_PATH: ${SKPORT_MONUMENT_PATH:-}
      SIGHTENGINE_USER: ${SIGHTENGINE_USER:-}
      SIGHTENGINE_SECRET: ${SIGHTENGINE_SECRET:-}
      MODERATECONTENT_KEY: ${MODERATECONTENT_KEY:-}
      HIVE_API_KEY: ${HIVE_API_KEY:-}
      DAILY_UPLOAD_LIMIT: ${DAILY_UPLOAD_LIMIT:-30}
    volumes:
      - ${UPLOADS_PATH:-/var/www/app/shared/uploads}:/app/uploads
      - ./goyfield-backend/static/banwords:/app/static/banwords:ro
      - ./goyfield-backend/static/banroots:/app/static/banroots:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/ivaqis/goyfield-frontend:latest
    build:
      context: ./arknights-tracker
    container_name: goyfield-frontend
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://goyfield.moe/api/v2}
      PUBLIC_AUDIO_BASE: ${PUBLIC_AUDIO_BASE:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
